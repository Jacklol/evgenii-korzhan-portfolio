<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="YPA AI money coach screen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172f2b"/>
      <stop offset="0.55" stop-color="#4b4d4d"/>
      <stop offset="1" stop-color="#25213f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#071210" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="390" height="844" rx="34" fill="url(#bg)"/>
  <text x="30" y="54" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">9:41</text>
  <text x="30" y="105" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#20ffa7">YPA COACH</text>
  <text x="30" y="139" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="850" fill="#ffffff">AI money coach</text>
  <text x="30" y="164" font-family="Inter, Arial, sans-serif" font-size="15" fill="#ffffff" opacity="0.7">Personal decisions, not generic tips</text>
  <g filter="url(#shadow)">
    <rect x="28" y="196" width="250" height="86" rx="24" fill="#ffffff" opacity="0.18"/>
    <text x="52" y="230" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Can I afford this trip?</text>
    <text x="52" y="257" font-family="Inter, Arial, sans-serif" font-size="13" fill="#ffffff" opacity="0.66">Check budget, bills and savings.</text>
    <rect x="84" y="312" width="278" height="122" rx="26" fill="#101f1c" opacity="0.78"/>
    <circle cx="122" cy="352" r="20" fill="#20ffa7" opacity="0.25"/>
    <text x="116" y="360" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" fill="#20ffa7">Y</text>
    <text x="154" y="347" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Yes, with one change</text>
    <text x="154" y="374" font-family="Inter, Arial, sans-serif" font-size="13" fill="#ffffff" opacity="0.66">Move $120 from dining to travel</text>
    <text x="154" y="397" font-family="Inter, Arial, sans-serif" font-size="13" fill="#ffffff" opacity="0.66">and keep your debt plan stable.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="28" y="480" width="334" height="78" rx="24" fill="#ffffff" opacity="0.16"/>
    <text x="54" y="512" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Action 1</text>
    <text x="54" y="538" font-family="Inter, Arial, sans-serif" font-size="13" fill="#ffffff" opacity="0.66">Lower restaurant budget by 18%</text>
    <rect x="28" y="580" width="334" height="78" rx="24" fill="#ffffff" opacity="0.16"/>
    <text x="54" y="612" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Action 2</text>
    <text x="54" y="638" font-family="Inter, Arial, sans-serif" font-size="13" fill="#ffffff" opacity="0.66">Pay credit card before Friday</text>
    <rect x="28" y="690" width="334" height="46" rx="23" fill="#20ffa7"/>
    <text x="195" y="719" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="850" fill="#062019">Apply plan</text>
  </g>
  <rect x="44" y="764" width="302" height="48" rx="24" fill="#ffffff" opacity="0.16"/>
  <circle cx="91" cy="788" r="8" fill="#ffffff" opacity="0.28"/>
  <circle cx="160" cy="788" r="8" fill="#20ffa7"/>
  <circle cx="229" cy="788" r="8" fill="#ffffff" opacity="0.28"/>
  <circle cx="298" cy="788" r="8" fill="#ffffff" opacity="0.28"/>
</svg>
